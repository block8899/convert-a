# .github/workflows/convert_models.yml
name: Convert Models to NCNN

on:
  workflow_dispatch: {}

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnxsim onnx gdown onnxscript
          # Download ncnn tools (pre-built binaries)
          wget -q https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu.zip
          unzip -q ncnn-20240820-ubuntu.zip
          echo "$PWD/ncnn-20240820-ubuntu/bin" >> $GITHUB_PATH

      - name: Verify ncnn tools
        run: |
          onnx2ncnn 2>&1 || true
          echo "onnx2ncnn path: $(which onnx2ncnn)"
      - name: Clone BiSeNet repo
        run: |
          git clone https://github.com/zllrunning/face-parsing.PyTorch.git repo_bisenet

      - name: Download weights from Google Drive
        run: |
          # BiSeNet (.pth)
          gdown "1D7SK1aFzQ30ZEd-Q0L7I5xBjRKMnvmZL" -O repo_bisenet/79999_iter.pth
          # AnimeGANv3 (.onnx)
          gdown "1e868B_Siu9XQNAF9fCeyD0Nf0PYOpQxv" -O AnimeGANv3_PortraitSketch_25.onnx
          # Verify
          ls -lh repo_bisenet/79999_iter.pth
          ls -lh AnimeGANv3_PortraitSketch_25.onnx

      - name: Convert BiSeNet (pth → PNNX → NCNN)
        run: python scripts/convert_bisenet.py

      - name: Convert AnimeGANv3 (ONNX → NCNN)
        run: python scripts/convert_animegan.py

      - name: Verify outputs
        run: |
          echo "=== Output files ==="
          ls -lh output/
          echo ""
          echo "=== Total size ==="
          du -sh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-models
          path: output/
          retention-days: 30

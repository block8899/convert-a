# .github/workflows/convert_models.yml
name: Convert Models to NCNN

on:
  workflow_dispatch: {}

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pnnx ncnn opencv-python-headless
          pip install gdown

      - name: Download BiSeNet weights
        run: |
          # Google Drive ID từ link: https://drive.google.com/file/d/154JgKbzCPWg2WDYjvGP3DdgVpfFljHXc
          gdown "154JgKbzCPWg2WDYjvGP3DdgVpfFljHXc" -O repo_bisenet/79999_iter.pth
          # Verify file size (should be ~170MB)
          ls -lh repo_bisenet/79999_iter.pth

      - name: Download AnimeGANv2 weights
        run: |
          mkdir -p repo_animegan
          gdown "1WK5MelfMlMWRiE0yVi05SSelVUWJ1Jzy" -O repo_animegan/face_paint_512_v2.pt
          ls -lh repo_animegan/face_paint_512_v2.pt

      - name: Convert BiSeNet → NCNN
        run: python scripts/convert_bisenet.py

      - name: Convert AnimeGANv3 → NCNN
        run: python scripts/convert_animeganv3.py

      - name: Verify outputs
        run: |
          echo "=== Output files ==="
          ls -lh output/
          echo ""
          echo "=== File sizes ==="
          du -sh output/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-models
          path: output/
          retention-days: 30

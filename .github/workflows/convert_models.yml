# .github/workflows/convert_models.yml
name: Convert Models to NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libprotobuf-dev protobuf-compiler

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install torch==2.1.0+cpu torchvision==0.16.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install onnxsim onnx gdown onnxscript
          pip install pnnx

      - name: Build ncnn tools
        run: |
          git clone --depth 1 https://github.com/Tencent/ncnn.git ncnn_src
          cd ncnn_src
          git submodule update --init
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DNCNN_VULKAN=OFF \
                -DNCNN_BUILD_TOOLS=ON \
                -DNCNN_BUILD_EXAMPLES=OFF \
                -DNCNN_BUILD_BENCHMARK=OFF ..
          make -j$(nproc)

          # Find and install onnx2ncnn
          ONNX2NCNN=$(find . -name 'onnx2ncnn' -type f | head -1)
          if [ -z "$ONNX2NCNN" ]; then
            echo "ERROR: onnx2ncnn not found after build"
            find . -name 'onnx2ncnn*' -ls
            exit 1
          fi
          echo "Found onnx2ncnn at: $ONNX2NCNN"
          sudo cp "$ONNX2NCNN" /usr/local/bin/onnx2ncnn
          sudo chmod +x /usr/local/bin/onnx2ncnn

          # Find and install ncnnoptimize
          NCNNOPT=$(find . -name 'ncnnoptimize' -type f | head -1)
          if [ -z "$NCNNOPT" ]; then
            echo "ERROR: ncnnoptimize not found after build"
            exit 1
          fi
          echo "Found ncnnoptimize at: $NCNNOPT"
          sudo cp "$NCNNOPT" /usr/local/bin/ncnnoptimize
          sudo chmod +x /usr/local/bin/ncnnoptimize

          # Verify
          echo "=== Verify ==="
          which onnx2ncnn
          which ncnnoptimize
          onnx2ncnn 2>&1 | head -3
          ncnnoptimize 2>&1 | head -3

      - name: Clone BiSeNet repo
        run: git clone https://github.com/zllrunning/face-parsing.PyTorch.git repo_bisenet

      - name: Download weights
        run: |
          gdown "1D7SK1aFzQ30ZEd-Q0L7I5xBjRKMnvmZL" -O repo_bisenet/79999_iter.pth
          gdown "1e868B_Siu9XQNAF9fCeyD0Nf0PYOpQxv" -O AnimeGANv3_PortraitSketch_25.onnx
          ls -lh repo_bisenet/79999_iter.pth AnimeGANv3_PortraitSketch_25.onnx

      - name: Convert BiSeNet
        timeout-minutes: 30
        run: python scripts/convert_bisenet.py

      - name: Convert AnimeGANv3
        timeout-minutes: 30
        run: python scripts/convert_animegan.py

      - name: Verify
        run: ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-models
          path: output/
          retention-days: 30

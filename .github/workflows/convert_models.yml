# convert_models.yml
name: Convert Models to NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==2.1.0+cpu torchvision==0.16.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir onnxsim onnx gdown onnxscript \
            "protobuf>=3.20.3,<5"

      - name: Build ncnn tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libprotobuf-dev protobuf-compiler
          git clone --depth 1 https://github.com/Tencent/ncnn.git ncnn_src
          cd ncnn_src && mkdir build && cd build
          cmake -DNCNN_BUILD_TOOLS=ON -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_VULKAN=OFF ..
          make -j$(nproc) onnx2ncnn
          sudo cp tools/onnx2ncnn /usr/local/bin/
          echo "onnx2ncnn built: $(which onnx2ncnn)"

      - name: Clone BiSeNet repo
        run: |
          git clone https://github.com/zllrunning/face-parsing.PyTorch.git repo_bisenet

      - name: Download weights
        run: |
          gdown "1D7SK1aFzQ30ZEd-Q0L7I5xBjRKMnvmZL" -O repo_bisenet/79999_iter.pth
          gdown "1e868B_Siu9XQNAF9fCeyD0Nf0PYOpQxv" -O AnimeGANv3_PortraitSketch_25.onnx
          ls -lh repo_bisenet/79999_iter.pth
          ls -lh AnimeGANv3_PortraitSketch_25.onnx

      - name: Convert BiSeNet
        timeout-minutes: 30
        run: python scripts/convert_bisenet.py

      - name: Convert AnimeGANv3
        timeout-minutes: 30
        run: python scripts/convert_animegan.py

      - name: Verify
        run: ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-models
          path: output/
          retention-days: 30

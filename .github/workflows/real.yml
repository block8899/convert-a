name: Convert RealPLKSR Dysample LayerNorm to NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    env:
      MODEL_NAME: 2xPublic_realplksr_dysample_layernorm_real
      ONNX_URL: https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real_fp32_op17.onnx
      NCNN_VER: "20240820"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install onnx onnxsim onnxruntime numpy

      # ── 1. Tải ONNX ───────────────────────────────────────────────────────
      - name: Download ONNX model
        run: |
          wget -q -O "${MODEL_NAME}.onnx" "$ONNX_URL"
          ls -lh "${MODEL_NAME}.onnx"

      # ── 2. Replace ScatterND + Dysample logic bằng ConvTranspose ──────────
      #
      # Trong RealPLKSR Dysample, mỗi block lk làm:
      #   1. Slice input → x_small (16 channels, H x W)
      #   2. conv 17x17 → offset (16ch, H x W)  [học offset cho từng pixel]
      #   3. ScatterND: scatter offset vào zero tensor (H*scale x W*scale)
      #   4. GridSample: dùng grid để sample từ input
      #
      # Vì ncnn không có ScatterND, ta replace toàn bộ cụm
      # Dysample bằng ConvTranspose (bilinear upsampling learned) —
      # đây là approximation nhưng là cách duy nhất để chạy trên ncnn.
      #
      # Cụ thể: thay cụm [Slice→conv→ScatterND→GridSample] bằng
      # một ConvTranspose 2x trên input gốc của block đó.
      # ─────────────────────────────────────────────────────────────────────
      - name: Replace Dysample (ScatterND+GridSample) with ConvTranspose
        run: |
          python3 << 'PYEOF'
          import onnx
          from onnx import helper, TensorProto, numpy_helper
          import numpy as np

          model = onnx.load("${{ env.MODEL_NAME }}.onnx")
          graph = model.graph

          # Build lookup: output_name → node
          output_to_node = {}
          for node in graph.node:
              for out in node.output:
                  output_to_node[out] = node

          # Build lookup: initializer name → numpy array
          initializers = {init.name: init for init in graph.initializer}

          def get_node_by_output(name):
              return output_to_node.get(name)

          # ── Tìm tất cả ScatterND nodes ────────────────────────────────────
          scatter_nodes = [n for n in graph.node if n.op_type == "ScatterND"]
          gridsample_nodes = [n for n in graph.node if n.op_type == "GridSample"]

          print(f"Found {len(scatter_nodes)} ScatterND nodes")
          print(f"Found {len(gridsample_nodes)} GridSample nodes")

          # ── Strategy: xóa toàn bộ Dysample subgraph, thay bằng Upsample ──
          # Dysample pipeline:
          #   data_in → [Slice channels 0:16] → conv_lk → scatter_input
          #   data_in → [Slice channels 0:16] → Shape → Expand → scatter
          #   scatter → GridSample(data_in) → scatter_out (=lk output)
          #
          # Ta thay thế: scatter_out = Resize(data_in, scale=1.0)
          # (giữ nguyên spatial, vì ScatterND output = H x W = input H x W)
          # GridSample output cũng = H x W với các channels gốc
          #
          # Thực ra Dysample output có cùng shape với input của nó,
          # nên ta có thể Identity pass-through data đến output của GridSample

          nodes_to_remove = set()
          nodes_to_add = []

          # Map GridSample output → input data blob
          gridsample_passthrough = {}  # gs_output → data_input

          for gs_node in gridsample_nodes:
              # GridSample inputs: [data, grid]
              # data = input feature map (e.g. Conv_output)
              # grid = output của ScatterND chain
              data_input = gs_node.input[0]
              gs_output = gs_node.output[0]
              gridsample_passthrough[gs_output] = data_input

          # Mark all nodes feeding into GridSample for removal
          # (ScatterND chain: ConstantOfShape, Equal, Where, Expand, Unsqueeze,
          #  Concat, Reshape, ScatterND, Shape, Crop của lk subgraph)
          def mark_subgraph_for_removal(node, visited=None):
              if visited is None:
                  visited = set()
              if id(node) in visited:
                  return visited
              visited.add(id(node))
              nodes_to_remove.add(id(node))
              for inp in node.input:
                  upstream = output_to_node.get(inp)
                  if upstream and upstream.op_type in {
                      "ScatterND", "ConstantOfShape", "Equal", "Where",
                      "Expand", "ExpandDims", "Concat", "Reshape",
                      "Shape", "Crop", "Slice", "Cast",
                  }:
                      mark_subgraph_for_removal(upstream, visited)
              return visited

          for gs_node in gridsample_nodes:
              nodes_to_remove.add(id(gs_node))
              # Mark the grid input chain (input[1] = grid = ScatterND output)
              grid_node = output_to_node.get(gs_node.input[1])
              if grid_node:
                  mark_subgraph_for_removal(grid_node)

          # Thay thế GridSample bằng Identity (pass data thẳng qua)
          for gs_output, data_input in gridsample_passthrough.items():
              identity_node = helper.make_node(
                  "Identity",
                  inputs=[data_input],
                  outputs=[gs_output],
                  name=f"dysample_bypass_{gs_output[:30]}"
              )
              nodes_to_add.append(identity_node)

          # Xây dựng graph mới
          new_nodes = []
          for node in graph.node:
              if id(node) not in nodes_to_remove:
                  new_nodes.append(node)
          new_nodes.extend(nodes_to_add)

          del graph.node[:]
          graph.node.extend(new_nodes)

          # Cast → Identity
          cast_replaced = 0
          final_nodes = []
          for node in graph.node:
              if node.op_type == "Cast":
                  to_type = next((a.i for a in node.attribute if a.name == "to"), None)
                  if to_type in (1, 10, 11):
                      final_nodes.append(helper.make_node(
                          "Identity", node.input[:1], node.output
                      ))
                      cast_replaced += 1
                      continue
              final_nodes.append(node)
          del graph.node[:]
          graph.node.extend(final_nodes)

          print(f"Removed {len(nodes_to_remove)} nodes from Dysample subgraph")
          print(f"Added {len(nodes_to_add)} bypass Identity nodes")
          print(f"Replaced {cast_replaced} Cast nodes")

          try:
              model = onnx.shape_inference.infer_shapes(model)
          except Exception as e:
              print(f"Shape inference warning: {e}")

          onnx.save(model, "${{ env.MODEL_NAME }}_preproc.onnx",
                    save_as_external_data=False)
          import os
          sz = os.path.getsize("${{ env.MODEL_NAME }}_preproc.onnx") / 1024 / 1024
          print(f"Saved pre-processed ONNX ({sz:.1f} MB)")

          # Final op check
          remaining = {}
          for node in model.graph.node:
              remaining[node.op_type] = remaining.get(node.op_type, 0) + 1
          blockers = [op for op in remaining if op in {"ScatterND", "GatherND"}]
          print("Remaining ops:", sorted(remaining.keys()))
          if blockers:
              print(f"❌ Still blocked: {blockers}")
              exit(1)
          else:
              print("✅ No blockers — ready for onnxsim")
          PYEOF

      # ── 3. Simplify ONNX ──────────────────────────────────────────────────
      - name: Simplify ONNX
        run: |
          python -m onnxsim \
            "${MODEL_NAME}_preproc.onnx" \
            "${MODEL_NAME}_sim.onnx" \
            --input-shape "input:1,3,256,256" 2>&1 \
            || cp "${MODEL_NAME}_preproc.onnx" "${MODEL_NAME}_sim.onnx"
          ls -lh "${MODEL_NAME}_sim.onnx"

      # ── 4. Final op check ─────────────────────────────────────────────────
      - name: Final audit before ncnn
        run: |
          python3 << 'PYEOF'
          import onnx
          model = onnx.load("${{ env.MODEL_NAME }}_sim.onnx")
          ops = {}
          for node in model.graph.node:
              ops[node.op_type] = ops.get(node.op_type, 0) + 1
          blockers = [op for op in ops if op in {"ScatterND", "GatherND"}]
          print("Ops:", sorted(ops.keys()))
          if blockers:
              print(f"❌ Blockers: {blockers}")
              exit(1)
          print("✅ Clean — converting to ncnn")
          PYEOF

      # ── 5. Cài ncnn tools ─────────────────────────────────────────────────
      - name: Install NCNN tools
        run: |
          wget -q "https://github.com/Tencent/ncnn/releases/download/${NCNN_VER}/ncnn-${NCNN_VER}-ubuntu-2204.zip"
          unzip -q "ncnn-${NCNN_VER}-ubuntu-2204.zip"
          chmod +x "ncnn-${NCNN_VER}-ubuntu-2204/bin/"*
          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb"
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb || true

      # ── 6. Convert ONNX → NCNN ────────────────────────────────────────────
      - name: Convert ONNX to NCNN
        run: |
          ONNX2NCNN="./ncnn-${NCNN_VER}-ubuntu-2204/bin/onnx2ncnn"
          $ONNX2NCNN "${MODEL_NAME}_sim.onnx" raw.param raw.bin 2>&1

          if [ ! -f "raw.param" ] || [ ! -f "raw.bin" ]; then
            echo "❌ onnx2ncnn failed"
            exit 1
          fi
          echo "=== onnx2ncnn OK ==="
          ls -lh raw.param raw.bin

      # ── 7. Post-process param ─────────────────────────────────────────────
      - name: Post-process NCNN param
        run: |
          cp raw.param "${MODEL_NAME}.param"
          cp raw.bin   "${MODEL_NAME}.bin"

          if grep -q "DepthToSpace" "${MODEL_NAME}.param"; then
            sed -i 's/DepthToSpace/PixelShuffle/g' "${MODEL_NAME}.param"
            echo "Replaced DepthToSpace → PixelShuffle"
          fi

          echo "=== Op summary ==="
          awk 'NR>2 {print $1}' "${MODEL_NAME}.param" | sort | uniq -c | sort -rn | head -20

          BIN_SIZE=$(stat -c%s "${MODEL_NAME}.bin")
          if [ "$BIN_SIZE" -lt 50000 ]; then
            echo "❌ .bin too small"
            exit 1
          fi

          echo ""
          echo "⚠️  NOTE: Dysample upsampler has been replaced with Identity bypass."
          echo "   The model will upscale using the PixelShuffle path only."
          echo "   Output quality may differ from original — verify visually."
          echo ""
          echo "=== FILES ==="
          ls -lh "${MODEL_NAME}.param" "${MODEL_NAME}.bin"

      # ── 8. Upload ─────────────────────────────────────────────────────────
      - name: Upload NCNN model
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODEL_NAME }}_ncnn
          path: |
            ${{ env.MODEL_NAME }}.param
            ${{ env.MODEL_NAME }}.bin
          retention-days: 90

      - name: Upload pre-processed ONNX (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODEL_NAME }}_onnx_preproc
          path: ${{ env.MODEL_NAME }}_preproc.onnx
          retention-days: 7

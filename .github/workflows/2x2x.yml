name: Fix ONNX MemoryData - Force Static Shape

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install onnx onnxsim onnx-graphsurgeon packaging

      - name: Download Author's ONNX
        run: |
          # Thay link này bằng link ONNX chính xác của tác giả nhé
          wget -O model_original.onnx "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan.onnx"

      - name: Force Static Input Shape & Simplify
        run: |
          python - <<EOF
          import onnx
          import onnx_graphsurgeon as og
          from onnxsim import simplify

          print("Đang load file ONNX gốc...")
          graph = og.import_onnx("model_original.onnx")

          # ÉP CỨNG KÍCH THƯỚC ĐẦU VÀO (Quan trọng nhất để triệt tiêu MemoryData)
          # Giả sử input tên là "input" và shape là [1, 3, -1, -1]
          # Ta ép nó thành [1, 3, 64, 64]
          for inp in graph.inputs:
              print(f"Node input tên là: {inp.name}, shape cũ: {inp.shape}")
              # Ép shape cứng (Batch=1, Channel=3, Height=64, Width=64)
              inp.shape = [1, 3, 64, 64] 
              
          graph.cleanup().toposort()
          onnx.save(og.export_onnx(graph), "model_static.onnx")
          print("Đã ép static shape thành công!")

          print("Đang chạy onnxsim để dọn dẹp các node thừa...")
          model = onnx.load("model_static.onnx")
          # Chạy simplify để xóa sạch các node tạo MemoryData
          model_simplified, check = simplify(model)
          
          if check:
              print("Simplify thành công!")
              onnx.save(model_simplified, "model_sim.onnx")
          else:
              print("Simplify lỗi, dùng file static shape.")
              onnx.save(model, "model_sim.onnx")
          EOF

      - name: Install onnx2ncnn & ncnnoptimize
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          git clone https://github.com/Tencent/ncnn.git
          cd ncnn
          mkdir build && cd build
          cmake .. -DONNX2NCNN=ON
          make -j$(nproc) onnx2ncnn ncnnoptimize
          sudo cp onnx2ncnn /usr/local/bin/
          sudo cp ncnnoptimize /usr/local/bin/

      - name: Convert to NCNN & Optimize (FP16)
        run: |
          onnx2ncnn model_sim.onnx model.param model.bin
          # Tối ưu và chuyển sang FP16
          ncnnoptimize model.param model.bin model_opt.param model_opt.bin 65536

      - name: Upload Clean NCNN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-clean-model-final
          path: |
            model_opt.param
            model_opt.bin
          retention-days: 7

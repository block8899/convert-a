name: Debug PLKSR Convert
on:
  workflow_dispatch:
    inputs:
      tile_size:
        description: 'Tile size'
        required: true
        default: '512'
        type: choice
        options: ['256', '512', '1024']

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 📊 Baseline system info
        run: |
          echo "=== CPU ===" && nproc
          echo "=== RAM ===" && free -h
          echo "=== DISK ===" && df -h

      - name: 💾 Expand swap to 16GB
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: |
          pip install --no-cache-dir torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir packaging safetensors spandrel pnnx
          free -h

      - name: ⬇️ Download PTH
        run: |
          wget -q -O model.pth \
            https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.pth
          ls -lh model.pth

      # ─────────────────────────────────────────────────────────────
      # KEY FIX: Patch DySample để không hardcode grid vào graph
      #
      # DySample.forward() gốc tạo base_grid bằng torch.meshgrid()
      # bên trong forward → PNNX inline nó thành MemoryData khổng lồ
      # (512×512×2 = 524288 floats phải ghi vào .param/.bin)
      #
      # Fix: Tạo một wrapper đơn giản hơn, dùng F.grid_sample trực tiếp
      # với grid được tính tại runtime → PNNX không cần serialize grid
      # ─────────────────────────────────────────────────────────────
      - name: 🔄 Export TorchScript (patched DySample)
        shell: python
        env:
          TILE_SIZE: ${{ inputs.tile_size }}
        run: |
          import os, gc, torch, torch.nn as nn, torch.nn.functional as F
          import subprocess
          from spandrel import ModelLoader

          def ram(label=""):
              print(f"=== RAM {label} ===")
              subprocess.run(["free", "-h"])

          tile = int(os.environ["TILE_SIZE"])
          print(f"Tile: {tile}x{tile}")

          # ── Patch DySample ────────────────────────────────────────
          # Import class gốc để lấy tên module
          from spandrel.architectures.__arch_helpers.dysample import DySample

          class DySamplePatched(nn.Module):
              """
              DySample wrapper không tạo base_grid trong forward.
              Thay vào đó dùng F.affine_grid + F.grid_sample thuần túy
              để PNNX không phải serialize MemoryData khổng lồ.
              """
              def __init__(self, orig: DySample):
                  super().__init__()
                  # Copy toàn bộ weights từ module gốc
                  self.scale      = orig.scale
                  self.style      = orig.style
                  self.groups     = orig.groups
                  self.end_conv   = orig.end_conv
                  if hasattr(orig, 'offset'):
                      self.offset = orig.offset
                  if hasattr(orig, 'scope'):
                      self.scope  = orig.scope
                  self.normalized = orig.normalized if hasattr(orig, 'normalized') else True

              def forward(self, x: torch.Tensor) -> torch.Tensor:
                  # Giống DySample.forward() nhưng không dùng pre-built grid
                  B, C, H, W = x.shape
                  scale = self.scale

                  # Tạo offset flow
                  offset = self.offset(x)                        # [B, 2*groups, H, W]
                  if hasattr(self, 'scope'):
                      offset = self.scope(offset).tanh()
                  
                  # Upsample offset lên H*scale, W*scale
                  offset = F.interpolate(
                      offset,
                      scale_factor=scale,
                      mode='bilinear',
                      align_corners=False
                  )                                              # [B, 2*groups, H*s, W*s]

                  Hs, Ws = H * scale, W * scale

                  # Tạo base grid tại runtime (không bị PNNX serialize)
                  # torch.linspace → không thành MemoryData lớn vì chỉ 1D
                  grid_y = torch.linspace(-1, 1, Hs, device=x.device, dtype=x.dtype)
                  grid_x = torch.linspace(-1, 1, Ws, device=x.device, dtype=x.dtype)
                  grid_y, grid_x = torch.meshgrid(grid_y, grid_x, indexing='ij')
                  base_grid = torch.stack([grid_x, grid_y], dim=-1)  # [Hs, Ws, 2]
                  base_grid = base_grid.unsqueeze(0).expand(B, -1, -1, -1)  # [B, Hs, Ws, 2]

                  # Reshape offset: [B, groups, Hs, Ws, 2]
                  offset = offset.view(B, self.groups, 2, Hs, Ws)
                  offset = offset.permute(0, 1, 3, 4, 2)              # [B, groups, Hs, Ws, 2]

                  # Expand input cho groups
                  x_up = F.interpolate(x, scale_factor=scale, mode='nearest')
                  x_up = x_up.view(B * self.groups, C // self.groups, Hs, Ws)

                  # Sample
                  outs = []
                  for g in range(self.groups):
                      grid_g = base_grid + offset[:, g]  # [B, Hs, Ws, 2]
                      x_g    = x_up[g::self.groups]      # [B, C//groups, Hs, Ws]  -- lấy từng group
                      sampled = F.grid_sample(
                          x_g, grid_g,
                          mode='bilinear',
                          padding_mode='border',
                          align_corners=True
                      )
                      outs.append(sampled)

                  out = torch.cat(outs, dim=1)            # [B, C, Hs, Ws]
                  return self.end_conv(out)

          # ── Thay thế tất cả DySample trong model ─────────────────
          ram("before load")
          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()
          ram("after load")

          patched = 0
          for name, module in model.named_modules():
              if isinstance(module, DySample):
                  parent_name, child_name = name.rsplit('.', 1) if '.' in name else ('', name)
                  parent = model if parent_name == '' else dict(model.named_modules())[parent_name]
                  setattr(parent, child_name, DySamplePatched(module))
                  patched += 1
          print(f"Patched {patched} DySample module(s)")

          model.eval()
          gc.collect()
          ram("after patch")

          dummy = torch.zeros(1, 3, tile, tile)

          # Warm-up
          print("Warm-up...")
          with torch.no_grad():
              out = model(dummy)
          print(f"Output: {out.shape}")
          del out; gc.collect()
          ram("after warm-up")

          # Trace
          print("JIT trace...")
          with torch.no_grad():
              traced = torch.jit.trace(model, dummy)
          del model; gc.collect()
          ram("after trace")

          traced.save("model.pt")
          del traced; gc.collect()
          print(f"model.pt: {os.path.getsize('model.pt')/1e6:.1f} MB")
          ram("after save")

      - name: 🔍 PNNX convert
        run: |
          TILE="${{ inputs.tile_size }}"
          echo "=== RAM before PNNX ===" && free -h

          SHAPE="[1,3,${TILE},${TILE}]"
          timeout 600 pnnx model.pt "inputshape=${SHAPE}" fp16=1 \
            && echo "✅ PNNX OK" \
            || { echo "❌ PNNX FAILED"; free -h; ls -lh; exit 1; }

          echo "=== RAM after PNNX ===" && free -h
          ls -lh

      - name: 📦 Rename outputs
        run: |
          TILE="${{ inputs.tile_size }}"
          BASE="2xPublic_realplksr_dysample_layernorm_real_${TILE}x${TILE}"
          mv model.ncnn.param "${BASE}.ncnn.param"
          mv model.ncnn.bin   "${BASE}.ncnn.bin"
          ls -lh *.ncnn.*

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "realplksr-${{ inputs.tile_size }}-ncnn"
          path: |
            *.ncnn.param
            *.ncnn.bin

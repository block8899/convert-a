name: Debug PLKSR Convert
on:
  workflow_dispatch:
    inputs:
      tile_size:
        description: 'Tile size'
        required: true
        default: '512'
        type: choice
        options: ['256', '512', '1024']

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 📊 Baseline system info
        run: |
          echo "=== CPU ===" && nproc
          echo "=== RAM ===" && free -h
          echo "=== DISK ===" && df -h

      - name: 💾 Expand swap to 16GB
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: |
          pip install --no-cache-dir torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir packaging safetensors spandrel pnnx
          free -h

      - name: ⬇️ Download PTH
        run: |
          wget -q -O model.pth \
            https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.pth
          ls -lh model.pth

      - name: 🔄 Export TorchScript (patched DySample)
        shell: python
        env:
          TILE_SIZE: ${{ inputs.tile_size }}
        run: |
          import os, gc, torch, torch.nn as nn, torch.nn.functional as F
          import subprocess
          from spandrel import ModelLoader
          from spandrel.architectures.__arch_helpers.dysample import DySample

          def ram(label=""):
              print(f"=== RAM {label} ===")
              subprocess.run(["free", "-h"])

          tile = int(os.environ["TILE_SIZE"])
          print(f"Tile: {tile}x{tile}")

          # ── Patch DySample.forward ────────────────────────────────
          # Vấn đề: forward() dùng torch.arange(H) + torch.arange(W)
          # → PNNX tạo MemoryData node với H=512 và W=512 phần tử
          # → meshgrid → MemoryData 512x512 = 262144 phần tử → crash
          #
          # Fix: Thay coords logic bằng F.affine_grid (1 op duy nhất,
          # PNNX serialize gọn thành AffineGrid node)
          # ─────────────────────────────────────────────────────────

          def dysample_forward_patched(self, x):
              offset = self.offset(x) * self.scope(x).sigmoid() * 0.5 + self.init_pos
              B, _, H, W = offset.shape
              offset = offset.view(B, 2, -1, H, W)

              # Thay toàn bộ coords/meshgrid bằng affine_grid identity
              # affine_grid tạo normalized grid [-1,1] mà không cần arange/meshgrid
              theta = torch.eye(2, 3, dtype=x.dtype, device=x.device).unsqueeze(0).expand(B, -1, -1)
              base_coords = F.affine_grid(theta, (B, 1, H, W), align_corners=False)
              # base_coords: [B, H, W, 2] (x,y) normalized

              # Convert về pixel space để cộng offset (giống logic gốc)
              # gốc: coords = (arange + 0.5) -> normalize về [-1,1] bằng /[W,H]*2-1
              # affine_grid đã cho grid trong [-1,1], convert sang pixel [0,W]/[0,H]:
              # pixel = (grid + 1) / 2 * [W, H] - 0.5  (align_corners=False convention)
              coords_pixel = (base_coords + 1) / 2 * torch.tensor(
                  [W, H], dtype=x.dtype, device=x.device
              ) - 0.5  # [B, H, W, 2]

              # Reshape để cộng offset: cần [B, 2, 1, H, W]
              coords_pixel = coords_pixel.permute(0, 3, 1, 2).unsqueeze(2)  # [B, 2, 1, H, W]

              # Cộng offset và normalize về [-1, 1]
              normalizer = torch.tensor([W, H], dtype=x.dtype, device=x.device).view(1, 2, 1, 1, 1)
              coords = 2 * (coords_pixel + offset) / normalizer - 1  # [B, 2, groups, H, W]

              coords = (
                  F.pixel_shuffle(coords.reshape(B, -1, H, W), self.scale)
                  .view(B, 2, -1, self.scale * H, self.scale * W)
                  .permute(0, 2, 3, 4, 1)
                  .contiguous()
                  .flatten(0, 1)
              )
              output = F.grid_sample(
                  x.reshape(B * self.groups, -1, H, W),
                  coords,
                  mode="bilinear",
                  align_corners=False,
                  padding_mode="border",
              ).view(B, -1, self.scale * H, self.scale * W)

              if self.end_convolution:
                  output = self.end_conv(output)

              return output

          # Monkey-patch method vào class (ảnh hưởng tất cả instances)
          DySample.forward = dysample_forward_patched
          print("DySample.forward patched OK")

          # ── Load + trace ──────────────────────────────────────────
          ram("before load")
          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()
          ram("after load")

          dummy = torch.zeros(1, 3, tile, tile)

          print("Warm-up...")
          with torch.no_grad():
              out = model(dummy)
          print(f"Output shape: {out.shape}")
          del out; gc.collect()
          ram("after warm-up")

          print("JIT trace...")
          with torch.no_grad():
              traced = torch.jit.trace(model, dummy)
          del model; gc.collect()
          ram("after trace")

          traced.save("model.pt")
          del traced; gc.collect()
          print(f"model.pt: {os.path.getsize('model.pt')/1e6:.1f} MB")
          ram("after save")

      - name: 🔍 PNNX convert
        run: |
          TILE="${{ inputs.tile_size }}"
          echo "=== RAM before PNNX ===" && free -h

          SHAPE="[1,3,${TILE},${TILE}]"
          timeout 600 pnnx model.pt "inputshape=${SHAPE}" fp16=1 \
            && echo "✅ PNNX OK" \
            || { echo "❌ PNNX FAILED"; free -h; ls -lh; exit 1; }

          echo "=== RAM after PNNX ===" && free -h
          ls -lh

      - name: 📦 Rename outputs
        run: |
          TILE="${{ inputs.tile_size }}"
          BASE="2xPublic_realplksr_dysample_layernorm_real_${TILE}x${TILE}"
          mv model.ncnn.param "${BASE}.ncnn.param"
          mv model.ncnn.bin   "${BASE}.ncnn.bin"
          ls -lh *.ncnn.*

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "realplksr-${{ inputs.tile_size }}-ncnn"
          path: |
            *.ncnn.param
            *.ncnn.bin

name: Debug PLKSR Convert
on:
  workflow_dispatch:
    inputs:
      tile_size:
        description: 'Tile size'
        required: true
        default: '512'
        type: choice
        options: ['256', '512', '1024']

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 📊 Baseline system info
        run: |
          echo "=== CPU ==="
          nproc
          echo "=== RAM ==="
          free -h
          echo "=== DISK ==="
          df -h
          echo "=== Swap ==="
          swapon --show || echo "(none)"

      - name: 💾 Expand swap to 16GB
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== RAM + Swap ==="
          free -h

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install torch
        run: |
          pip install --no-cache-dir torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          echo "=== RAM sau torch ==="
          free -h

      - name: 📦 Install other deps
        run: |
          pip install --no-cache-dir packaging safetensors spandrel pnnx
          echo "=== RAM sau deps ==="
          free -h

      - name: ⬇️ Download PTH
        run: |
          wget -q -O model.pth \
            https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.pth
          ls -lh model.pth
          free -h

      - name: 🔍 Debug Load model
        shell: python
        run: |
          import gc, torch, subprocess
          from spandrel import ModelLoader

          def ram(label=""):
              print(f"=== RAM {label} ===")
              subprocess.run(["free", "-h"])

          ram("before load")
          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()
          ram("after load")
          total = sum(p.numel() for p in model.parameters())
          print(f"Model params: {total:,} ({total*4/1e6:.1f} MB fp32)")

      - name: 🔍 Debug Trace model
        shell: python
        env:
          TILE_SIZE: ${{ inputs.tile_size }}
        run: |
          import os, gc, torch, subprocess
          from spandrel import ModelLoader

          def ram(label=""):
              print(f"=== RAM {label} ===")
              subprocess.run(["free", "-h"])

          tile = int(os.environ["TILE_SIZE"])
          print(f"Tile: {tile}x{tile}")

          ram("before load")
          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()
          ram("after load")

          dummy = torch.zeros(1, 3, tile, tile)
          ram(f"after dummy {tile}x{tile}")

          print("Warm-up...")
          with torch.no_grad():
              out = model(dummy)
          print(f"Output shape: {out.shape}")
          del out
          gc.collect()
          ram("after warm-up")

          print("JIT trace...")
          with torch.no_grad():
              traced = torch.jit.trace(model, dummy)
          del model
          gc.collect()
          ram("after trace")

          print("Save model.pt...")
          traced.save("model.pt")
          del traced
          gc.collect()
          ram("after save")
          print(f"model.pt size: {os.path.getsize('model.pt')/1e6:.1f} MB")

      - name: 🔍 Debug PNNX convert
        run: |
          TILE="${{ inputs.tile_size }}"
          echo "=== RAM before PNNX ==="
          free -h
          echo "Running PNNX tile=${TILE}..."

          SHAPE="[1,3,${TILE},${TILE}]"
          timeout 600 pnnx model.pt "inputshape=${SHAPE}" fp16=1 \
            && echo "PNNX OK" \
            || { echo "PNNX FAILED"; free -h; ls -lh; exit 1; }

          echo "=== RAM after PNNX ==="
          free -h
          ls -lh

      - name: 📦 Rename outputs
        run: |
          TILE="${{ inputs.tile_size }}"
          OUTNAME="2xPublic_realplksr_dysample_layernorm_real_${TILE}x${TILE}"
          mv model.ncnn.param "${OUTNAME}.ncnn.param"
          mv model.ncnn.bin   "${OUTNAME}.ncnn.bin"
          ls -lh *.ncnn.*

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "realplksr-${{ inputs.tile_size }}-ncnn"
          path: |
            *.ncnn.param
            *.ncnn.bin

name: Convert PLKSR
on:
  workflow_dispatch:
    inputs:
      tile_size:
        description: 'Tile size'
        required: true
        default: '512'
        type: choice
        options: ['256', '512', '1024']

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          nproc && free -h && df -h

      - name: Expand swap to 16GB
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --no-cache-dir torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir packaging safetensors spandrel pnnx
          free -h

      - name: Download PTH
        run: |
          wget -q -O model.pth https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.pth
          ls -lh model.pth

      - name: Patch dysample.py on disk
        run: python scripts/patch_dysample.py

      - name: Export TorchScript
        env:
          TILE_SIZE: ${{ inputs.tile_size }}
        run: python scripts/export_torchscript.py

      - name: PNNX convert
        run: |
          TILE="${{ inputs.tile_size }}"
          free -h
          SHAPE="[1,3,${TILE},${TILE}]"
          timeout 600 pnnx model.pt "inputshape=${SHAPE}" fp16=1 && echo "PNNX OK" || { free -h; ls -lh; exit 1; }
          free -h && ls -lh

      - name: Rename outputs
        run: |
          TILE="${{ inputs.tile_size }}"
          BASE="2xPublic_realplksr_dysample_layernorm_real_${TILE}x${TILE}"
          mv model.ncnn.param "${BASE}.ncnn.param"
          mv model.ncnn.bin   "${BASE}.ncnn.bin"
          ls -lh *.ncnn.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "realplksr-${{ inputs.tile_size }}-ncnn"
          path: |
            *.ncnn.param
            *.ncnn.bin

name: Convert Real-PLKSR

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Tên model (không đuôi)'
        required: true
        default: '2xPublic_realplksr_dysample_layernorm_real'
      onnx_url:
        description: 'URL file ONNX (bỏ trống nếu không tải)'
        required: false
        default: 'https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.onnx'
      pth_url:
        description: 'URL file PTH (bỏ trống nếu không convert NCNN)'
        required: false
        default: 'https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.pth'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      MODEL_NAME: ${{ github.event.inputs.model_name }}

    steps:
      # -------------------------------------------------
      # 1. Chuẩn bị môi trường
      # -------------------------------------------------
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install spandrel
          sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: 🔧 Build PNNX
        run: |
          git clone --depth 1 https://github.com/nihui/pnnx.git /tmp/pnnx
          cd /tmp/pnnx
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) pnnx
          echo "/tmp/pnnx/build" >> $GITHUB_PATH

      # -------------------------------------------------
      # 2. Tải ONNX (nếu có)
      # -------------------------------------------------
      - name: ⬇️ Download ONNX
        if: github.event.inputs.onnx_url != ''
        run: |
          wget -O "${MODEL_NAME}.onnx" "${{ github.event.inputs.onnx_url }}"
          ls -lh "${MODEL_NAME}.onnx"

      # -------------------------------------------------
      # 3. Tải PTH và Convert sang NCNN bằng PNNX
      # -------------------------------------------------
      - name: ⬇️ Download PTH
        if: github.event.inputs.pth_url != ''
        run: |
          wget -O "model.pth" "${{ github.event.inputs.pth_url }}"
          ls -lh "model.pth"

      - name: 🔄 Export TorchScript
        if: github.event.inputs.pth_url != ''
        shell: python
        run: |
          import torch
          from spandrel import ModelLoader

          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()

          print(f"Arch: {arch.architecture_name}, Scale: {arch.scale}x")

          dummy = torch.randn(1, 3, 64, 64)
          with torch.no_grad():
              traced = torch.jit.trace(model, dummy)
              traced.save("ts_model.pt")

          print("TorchScript exported!")

      - name: 🔄 PNNX to NCNN
        if: github.event.inputs.pth_url != ''
        run: |
          pnnx ts_model.pt inputshape=[1,3,64,64]
          
          if [ -f "ts_model.ncnn.param" ]; then
            mv ts_model.ncnn.param "${MODEL_NAME}.ncnn.param"
            mv ts_model.ncnn.bin "${MODEL_NAME}.ncnn.bin"
            echo "✅ NCNN conversion successful!"
          else
            echo "❌ PNNX failed"
            exit 1
          fi

      # -------------------------------------------------
      # 4. Đẩy kết quả lên Artifact
      # -------------------------------------------------
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODEL_NAME }}
          path: |
            *.onnx
            *.ncnn.param
            *.ncnn.bin
          retention-days: 30

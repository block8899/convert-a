name: Convert 1xDeNoise_realplksr_otf to NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install packaging safetensors spandrel pnnx

      - name: ⬇️ Download PTH
        run: |
          wget -O model.pth "https://github.com/Phhofm/models/releases/download/1xDeNoise_realplksr_otf/1xDeNoise_realplksr_otf.pth"

      - name: 🔄 Export TorchScript
        shell: python
        run: |
          import torch
          from spandrel import ModelLoader

          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()

          dummy = torch.randn(1, 3, 256, 256)

          with torch.no_grad():
              torch.jit.trace(model, dummy).save("model.pt")
          print("✅ TorchScript exported with 256x256 shape")

      - name: 🔄 PNNX → NCNN
        run: |
          pnnx model.pt inputshape=[1,3,256,256]

          if [ -f "model.ncnn.param" ]; then
            mv model.ncnn.param 1xDeNoise_realplksr_otf.ncnn.param
            mv model.ncnn.bin   1xDeNoise_realplksr_otf.ncnn.bin
            echo "✅ NCNN conversion successful!"
            ls -lh *.ncnn.*
          else
            echo "❌ PNNX failed"
            exit 1
          fi

      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: 1xDeNoise_realplksr_otf-ncnn
          path: |
            *.ncnn.param
            *.ncnn.bin
          retention-days: 7

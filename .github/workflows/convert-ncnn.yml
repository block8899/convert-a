name: Convert 1xDeNoise_realplksr_otf to NCNN

on:
  workflow_dispatch:
    inputs:
      source_format:
        description: 'Chọn file nguồn để convert?'
        required: true
        default: 'onnx'
        type: choice
        options:
          - onnx
          - pth
      fp16:
        description: 'Nén weights sang FP16? (Giảm 50% dung lượng)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────── Checkout ───────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─────────────────── Python Setup ───────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ─────────────────── Install Python deps ───────────────────
      - name: 📦 Install Python dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # ─────────────────── Build NCNN tools ───────────────────
      - name: 🔨 Build NCNN (onnx2ncnn, ncnnoptimize)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake git
          git clone --depth 1 --recursive https://github.com/Tencent/ncnn.git /tmp/ncnn
          mkdir -p /tmp/ncnn/build && cd /tmp/ncnn/build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DNCNN_BUILD_TOOLS=ON -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_PYTHON=OFF -DNCNN_VULKAN=OFF
          cmake --build . -j$(nproc)
          echo "✅ NCNN tools built"

      # ─────────────────── Download Model ───────────────────
      - name: ⬇️ Download source model
        run: |
          if [ "${{ github.event.inputs.source_format }}" == "onnx" ]; then
            URL="https://github.com/Phhofm/models/releases/download/1xDeNoise_realplksr_otf/1xDeNoise_realplksr_otf_fp32.onnx"
            FILENAME="model.onnx"
          else
            URL="https://github.com/Phhofm/models/releases/download/1xDeNoise_realplksr_otf/1xDeNoise_realplksr_otf.pth"
            FILENAME="model.pth"
          fi
          echo "⬇️ Downloading: $URL"
          wget -q "$URL" -O "$FILENAME"
          ls -lh "$FILENAME"

      # ─────────────────── PTH → ONNX (if needed) ───────────────────
      - name: 🔄 Convert PTH → ONNX
        if: github.event.inputs.source_format == 'pth'
        run: |
          python scripts/convert_helpers.py \
            --input model.pth \
            --output model.onnx \
            --input_shape 1,3,256,256

      # ─────────────────── Simplify ONNX ───────────────────
      - name: ✂️ Simplify ONNX
        run: |
          python -c "
          import onnx
          from onnxsim import simplify

          model = onnx.load('model.onnx')
          input_shapes = {}
          for inp in model.graph.input:
              shape = [d.dim_value if d.dim_value else 1 for d in inp.type.tensor_type.shape.dim]
              input_shapes[inp.name] = shape

          model_simp, check = simplify(model, input_shapes=input_shapes)
          assert check, 'Simplified ONNX model could not be validated'
          onnx.save(model_simp, 'model_simplified.onnx')

          import os
          simp_size = os.path.getsize('model_simplified.onnx') / 1024 / 1024
          print(f'✅ Simplified ONNX saved ({simp_size:.2f} MB)')
          "
          mv model_simplified.onnx model.onnx

      # ─────────────────── ONNX → NCNN ───────────────────
      - name: 🔄 Convert ONNX → NCNN
        run: |
          /tmp/ncnn/build/tools/onnx/onnx2ncnn model.onnx 1xDeNoise_realplksr_otf.param 1xDeNoise_realplksr_otf.bin
          echo "✅ onnx2ncnn done"
          ls -lh 1xDeNoise_realplksr_otf.param 1xDeNoise_realplksr_otf.bin

      # ─────────────────── NCNN Optimize (FP16) ───────────────────
      - name: ⚡ Optimize NCNN (FP16)
        if: github.event.inputs.fp16 == 'true'
        run: |
          /tmp/ncnn/build/tools/ncnnoptimize \
            1xDeNoise_realplksr_otf.param \
            1xDeNoise_realplksr_otf.bin \
            1xDeNoise_realplksr_otf_opt.param \
            1xDeNoise_realplksr_otf_opt.bin \
            65536

          mv 1xDeNoise_realplksr_otf_opt.param 1xDeNoise_realplksr_otf.param
          mv 1xDeNoise_realplksr_otf_opt.bin 1xDeNoise_realplksr_otf.bin
          echo "✅ ncnnoptimize (FP16) done"
          ls -lh 1xDeNoise_realplksr_otf.param 1xDeNoise_realplksr_otf.bin

      # ─────────────────── Verify NCNN inference ───────────────────
      - name: 🧪 Verify NCNN model
        run: |
          python -c "
          import ncnn
          import numpy as np

          net = ncnn.Net()
          net.load_param('1xDeNoise_realplksr_otf.param')
          net.load_model('1xDeNoise_realplksr_otf.bin')

          mat_in = ncnn.Mat.from_numpy(np.random.rand(3, 256, 256).astype(np.float32))
          ex = net.create_extractor()
          ex.input('input', mat_in)
          ret, mat_out = ex.extract('output')

          if ret == 0:
              print(f'✅ NCNN inference OK! Output: {mat_out.c}x{mat_out.h}x{mat_out.w}')
          else:
              print(f'❌ NCNN inference failed (ret={ret})')
          "

      # ─────────────────── Upload Artifacts ───────────────────
      - name: 📤 Upload NCNN model
        uses: actions/upload-artifact@v4
        with:
          name: 1xDeNoise_realplksr_otf-ncnn
          path: |
            1xDeNoise_realplksr_otf.param
            1xDeNoise_realplksr_otf.bin
          retention-days: 30

      # ─────────────────── Summary ───────────────────
      - name: 📋 Summary
        if: always()
        run: |
          echo "========================================="
          echo "  NCNN CONVERSION SUMMARY"
          echo "========================================="
          ls -lh 1xDeNoise_realplksr_otf.param 1xDeNoise_realplksr_otf.bin 2>/dev/null
          echo "========================================="

name: Convert 2xParagonSR_Nano_gan (Auto-Fix Param)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install onnx onnxsim numpy

      - name: Download ONNX model
        run: |
          wget -q -O net_g_75000_fused_op18_fp32.onnx \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q -O net_g_75000_fused_op18_fp32.onnx.data \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"
          ls -lh net_g_75000_fused_op18_fp32.onnx net_g_75000_fused_op18_fp32.onnx.data

      # ── BƯỚC MỚI: Trích xuất split info từ ONNX TRƯỚC KHI simplify ──
      - name: Merge data, decompose Mish & extract split config
        run: |
          python3 << 'PYEOF'
          import onnx, json, os, numpy as np
          from onnx import helper

          print("Loading ONNX with external data...")
          model = onnx.load("net_g_75000_fused_op18_fp32.onnx")
          print("External data merged OK")

          # ── Decompose Mish → Softplus + Tanh + Mul ──
          new_nodes = []
          mish_count = 0
          for node in model.graph.node:
              if node.op_type == "Mish":
                  mish_count += 1
                  x  = node.input[0]
                  y  = node.output[0]
                  sp = y + "_softplus"
                  th = y + "_tanh"
                  new_nodes.append(helper.make_node("Softplus", [x],     [sp]))
                  new_nodes.append(helper.make_node("Tanh",     [sp],    [th]))
                  new_nodes.append(helper.make_node("Mul",      [x, th], [y]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)
          print(f"Replaced {mish_count} Mish nodes")

          # ── Trích xuất Split node info động ──
          # Hỗ trợ cả opset 11 (attribute) và opset 13+ (initializer input)
          split_config = {}
          for node in model.graph.node:
              if node.op_type != 'Split':
                  continue

              split_sizes = []

              # opset 13+: split sizes nằm ở input thứ 2 (initializer)
              if len(node.input) > 1:
                  for init in model.graph.initializer:
                      if init.name == node.input[1]:
                          if init.raw_data:
                              dt = np.int64 if init.data_type == 7 else np.int32
                              split_sizes = np.frombuffer(init.raw_data, dtype=dt).tolist()
                          if not split_sizes and list(init.int64_data):
                              split_sizes = list(init.int64_data)
                          if not split_sizes and list(init.int32_data):
                              split_sizes = list(init.int32_data)
                          break

              # opset 11: split sizes nằm ở attribute 'split'
              if not split_sizes:
                  for attr in node.attribute:
                      if attr.name == 'split':
                          split_sizes = list(attr.ints)
                          break

              if not split_sizes:
                  print(f"  WARNING: Cannot determine split sizes for '{node.name}'")
                  continue

              # Tính cumulative offsets
              offsets = [0]
              for s in split_sizes:
                  offsets.append(offsets[-1] + int(s))

              out_map = {}
              for i, out_name in enumerate(node.output):
                  out_map[out_name] = [offsets[i], offsets[i + 1]]

              split_config[node.name] = {
                  'outputs': out_map,
                  'split_sizes': [int(s) for s in split_sizes]
              }
              print(f"  Split '{node.name}': sizes={[int(s) for s in split_sizes]}, "
                    f"total_channels={offsets[-1]}")

          with open('split_config.json', 'w') as f:
              json.dump(split_config, f, indent=2)
          print(f"\nExtracted info for {len(split_config)} Split nodes")

          onnx.save(model, "merged.onnx", save_as_external_data=False)
          size_mb = os.path.getsize("merged.onnx") / (1024 * 1024)
          print(f"Saved merged.onnx ({size_mb:.1f} MB)")
          PYEOF

      - name: Simplify ONNX
        run: |
          python -m onnxsim merged.onnx model_simplified.onnx \
            --input-shape "input:1,3,512,512" 2>&1 \
            || cp merged.onnx model_simplified.onnx
          ls -lh model_simplified.onnx

      - name: Download ncnn tools (20240820) & install deps
        run: |
          wget -q "https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip"
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/*

          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb"
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb || true

      - name: Convert ONNX to NCNN
        run: |
          ONNX2NCNN=./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn
          $ONNX2NCNN model_simplified.onnx raw.param raw.bin 2>&1

          if [ ! -f "raw.param" ] || [ ! -f "raw.bin" ]; then
            echo "ERROR: onnx2ncnn failed!"
            exit 1
          fi
          echo "=== onnx2ncnn OK ==="
          ls -lh raw.param raw.bin

      # ── BƯỚC MỚI: Debug raw.param trước khi fix ──
      - name: Debug - Inspect raw param structure
        run: |
          echo "=== Header ==="
          head -3 raw.param
          echo ""
          echo "=== Dynamic Split/Slice layers ==="
          grep -E "^(Split|Slice)" raw.param || echo "(none found)"
          echo ""
          echo "=== Layer type summary ==="
          awk 'NR>2 {print $1}' raw.param | sort | uniq -c | sort -rn
          echo ""
          echo "=== DepthToSpace layers ==="
          grep "DepthToSpace" raw.param || echo "(none)"

      - name: Auto-Fix NCNN Param (Dynamic Split -> Static Crop)
        run: |
          python3 << 'PYEOF'
          import re, json, os

          blob_split_map = {}
          if os.path.exists('split_config.json'):
              with open('split_config.json') as f:
                  cfg = json.load(f)
              for node_name, info in cfg.items():
                  for blob, (s, e) in info['outputs'].items():
                      blob_split_map[blob] = (int(s), int(e))
              print(f"Loaded {len(blob_split_map)} blob→channel_range entries")
          else:
              print("WARNING: split_config.json not found, fallback only")

          FALLBACK = {0: (0, 15), 1: (15, 18), 2: (18, 21), 3: (21, 24)}

          def fix_ncnn_param(input_file, output_file):
              with open(input_file, 'r') as f:
                  lines = f.readlines()

              magic   = lines[0]
              counts  = lines[1].strip().split()
              layer_count = int(counts[0])
              blob_count  = int(counts[1])

              new_lines = [magic, lines[1]]
              removed = 0
              added   = 0

              for line in lines[2:]:
                  parts = line.strip().split()
                  if not parts:
                      new_lines.append(line)
                      continue

                  op_type   = parts[0]
                  node_name = parts[1]

                  # ── Xóa MemoryData val_24 (mồ côi) ──
                  if op_type == 'MemoryData' and node_name == 'val_24':
                      removed += 1
                      print(f"  Removed orphan: MemoryData val_24")
                      continue

                  # ── Xóa Split splitncnn_0 (mồ côi, chia val_24) ──
                  if op_type == 'Split' and node_name == 'splitncnn_0':
                      removed += 1
                      print(f"  Removed orphan: Split splitncnn_0")
                      continue

                  # ── Dynamic Split/Slice → static Crop ──
                  if op_type in ['Slice', 'Split']:
                      try:
                          num_inputs  = int(parts[2])
                          num_outputs = int(parts[3])
                      except (IndexError, ValueError):
                          new_lines.append(line)
                          continue

                      if num_inputs > 1:
                          input_blobs  = parts[4 : 4 + num_inputs]
                          output_blobs = parts[4 + num_inputs : 4 + num_inputs + num_outputs]
                          data_blob    = input_blobs[0]

                          for i, out_blob in enumerate(output_blobs):
                              if out_blob in blob_split_map:
                                  start, end = blob_split_map[out_blob]
                              else:
                                  idx = -1
                                  match = re.search(r'_(\d+)$', out_blob)
                                  if match:
                                      idx = int(match.group(1))
                                  if idx not in FALLBACK:
                                      idx = i
                                  if idx in FALLBACK:
                                      start, end = FALLBACK[idx]
                                  else:
                                      new_lines.append(line)
                                      continue

                              ncrop = end - start
                              if ncrop <= 0:
                                  new_lines.append(line)
                                  continue

                              # ★ 2=coffset  6=outc (số channel crop)
                              static_line = (
                                  f"Crop"
                                  f"            {node_name}_{i}"
                                  f" 1 1"
                                  f" {data_blob}"
                                  f" {out_blob}"
                                  f" 2={start}"
                                  f" 6={ncrop}\n"
                              )
                              new_lines.append(static_line)
                              added += 1
                              print(f"  Crop {node_name}_{i}: "
                                    f"coffset={start} outc={ncrop}")

                          removed += 1
                          print(f"  Replaced '{node_name}' → {num_outputs} Crop")
                          continue

                  new_lines.append(line)

              new_layer_count = layer_count - removed + added
              new_lines[1] = f"{new_layer_count} {blob_count}\n"

              with open(output_file, 'w') as f:
                  f.writelines(new_lines)

              print(f"\n✅ Removed {removed} nodes, added {added} Crop nodes")

          fix_ncnn_param('raw.param', '2xParagonSR_Nano_gan.param')
          PYEOF

      # ── Sửa DepthToSpace → PixelShuffle với tham số đúng ──
      - name: DepthToSpace → PixelShuffle (with scale factor)
        run: |
          cp raw.bin 2xParagonSR_Nano_gan.bin

          if grep -q "DepthToSpace" 2xParagonSR_Nano_gan.param; then
            echo "Converting DepthToSpace → PixelShuffle..."

            # Dùng Python để thay thế chính xác, giữ tham số
            python3 << 'PYEOF'
          with open('2xParagonSR_Nano_gan.param', 'r') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if 'DepthToSpace' in line:
                  # Thay tên layer
                  line = line.replace('DepthToSpace', 'PixelShuffle')
                  # Đảm bảo có tham số 0= (block_size/scale_factor)
                  # Nếu chưa có, thêm 0=2 cho model 2x
                  if ' 0=' not in line:
                      line = line.rstrip() + ' 0=2'
                      print(f"  Added 0=2 to PixelShuffle")
                  print(f"  → {line.rstrip()}")
              new_lines.append(line)

          with open('2xParagonSR_Nano_gan.param', 'w') as f:
              f.writelines(new_lines)
          PYEOF

            echo "=== PixelShuffle layers ==="
            grep "PixelShuffle" 2xParagonSR_Nano_gan.param || echo "(none)"
          else
            echo "No DepthToSpace layers found in param"
          fi

      # ── Chạy ncnnoptimize với fallback nếu crash ──
      - name: Optimize NCNN (crash-safe with fallback)
        run: |
          NCNNOPTIMIZE=./ncnn-20240820-ubuntu-2204/bin/ncnnoptimize

          echo "Running ncnnoptimize..."
          if $NCNNOPTIMIZE 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin \
               optimized.param optimized.bin 0 2>&1; then
            mv optimized.param 2xParagonSR_Nano_gan.param
            mv optimized.bin   2xParagonSR_Nano_gan.bin
            echo "✅ ncnnoptimize completed successfully."
          else
            EXIT_CODE=$?
            echo "⚠️ ncnnoptimize crashed (exit $EXIT_CODE)! Falling back to manual cleanup..."

            python3 << 'PYEOF'
          """
          Manual cleanup thay thế ncnnoptimize:
          - Xóa MemoryData mồ côi (output không được consumed)
          - Cập nhật layer count trong header
          """
          with open('2xParagonSR_Nano_gan.param', 'r') as f:
              lines = f.readlines()

          magic  = lines[0]
          counts = lines[1].strip().split()
          layer_count = int(counts[0])
          blob_count  = int(counts[1])

          # Thu thập tất cả blob names được dùng làm input
          consumed_blobs = set()
          layer_entries  = []

          for line in lines[2:]:
              parts = line.strip().split()
              if not parts:
                  layer_entries.append(line)
                  continue
              try:
                  ni = int(parts[2])
                  no = int(parts[3])
              except (IndexError, ValueError):
                  layer_entries.append(line)
                  continue
              inputs = parts[4:4+ni]
              for b in inputs:
                  consumed_blobs.add(b)
              layer_entries.append(line)

          # Xóa MemoryData layers mà output blob không được ai consume
          new_lines = [magic, lines[1]]
          removed = 0
          for line in layer_entries:
              parts = line.strip().split()
              if parts and parts[0] == 'MemoryData':
                  try:
                      ni = int(parts[2])
                      no = int(parts[3])
                      outputs = parts[4+ni:4+ni+no]
                      if not any(b in consumed_blobs for b in outputs):
                          removed += 1
                          print(f"  Removed orphan MemoryData: {parts[1]}")
                          continue
                  except (IndexError, ValueError):
                      pass
              new_lines.append(line)

          new_layer_count = layer_count - removed
          new_lines[1] = f"{new_layer_count} {blob_count}\n"

          with open('2xParagonSR_Nano_gan.param', 'w') as f:
              f.writelines(new_lines)

          print(f"✅ Manual cleanup: removed {removed} orphan MemoryData layers")
          PYEOF
          fi

      - name: Final check & Validate
        run: |
          echo "=== Final Param Validation ==="
          head -3 2xParagonSR_Nano_gan.param

          # Kiểm tra input tensor
          if grep -q "Input.*input" 2xParagonSR_Nano_gan.param; then
            echo "✅ Input tensor name: 'input'"
          else
            echo "⚠️ Input tensor name might not be 'input'!"
            grep "^Input" 2xParagonSR_Nano_gan.param | head -3
          fi

          # Kiểm tra MemoryData
          MDCOUNT=$(grep -c "MemoryData" 2xParagonSR_Nano_gan.param 2>/dev/null || echo "0")
          if [ "$MDCOUNT" -gt 0 ]; then
            echo "⚠️ Still has $MDCOUNT MemoryData layers"
          else
            echo "✅ Clean from orphan MemoryData"
          fi

          # Kiểm tra Crop layers
          CROPCOUNT=$(grep -c "^Crop" 2xParagonSR_Nano_gan.param 2>/dev/null || echo "0")
          echo "ℹ️ Crop layers: $CROPCOUNT"

          # Kiểm tra PixelShuffle
          grep -c "PixelShuffle" 2xParagonSR_Nano_gan.param >/dev/null 2>&1 \
            && echo "✅ Has PixelShuffle layer(s)" \
            || echo "ℹ️ No PixelShuffle (may use different upsampling)"

          # Kiểm tra bin size
          BIN_SIZE=$(stat -c%s "2xParagonSR_Nano_gan.bin")
          if [ "$BIN_SIZE" -lt 50000 ]; then
            echo "ERROR: .bin file too small ($BIN_SIZE bytes)!"
            exit 1
          fi

          echo ""
          echo "=== CONVERSION SUCCESS ==="
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn_autofixed
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
            split_config.json
          retention-days: 1

name: Convert 2xParagonSR_Nano_gan

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install onnx onnxsim numpy

      - name: Download ONNX model
        run: |
          wget -q -O net_g_75000_fused_op18_fp32.onnx \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q -O net_g_75000_fused_op18_fp32.onnx.data \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"
          ls -lh net_g_75000_fused_op18_fp32.onnx net_g_75000_fused_op18_fp32.onnx.data

      - name: Merge data & decompose Mish
        run: |
          python3 << 'PYEOF'
          import onnx, os
          from onnx import helper
          model = onnx.load("net_g_75000_fused_op18_fp32.onnx")
          new_nodes = []
          for node in model.graph.node:
              if node.op_type == "Mish":
                  x = node.input[0]; y = node.output[0]
                  new_nodes.append(helper.make_node("Softplus", [x], [y+"_sp"]))
                  new_nodes.append(helper.make_node("Tanh", [y+"_sp"], [y+"_th"]))
                  new_nodes.append(helper.make_node("Mul", [x, y+"_th"], [y]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)
          onnx.save(model, "merged.onnx", save_as_external_data=False)
          print(f"merged.onnx: {os.path.getsize('merged.onnx')/(1024*1024):.1f} MB")
          PYEOF

      - name: Simplify ONNX
        run: |
          python -m onnxsim merged.onnx model_simplified.onnx \
            --input-shape "input:1,3,512,512" 2>&1 || cp merged.onnx model_simplified.onnx
          ls -lh model_simplified.onnx

      - name: Download ncnn tools
        run: |
          wget -q "https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip"
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/*
          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb"
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb || true

      - name: Convert ONNX to NCNN
        run: |
          ./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn model_simplified.onnx raw.param raw.bin 2>&1
          echo "=== raw.param header ==="
          head -3 raw.param
          echo ""
          echo "=== MemoryData count ==="
          grep -c "MemoryData" raw.param || echo 0
          echo ""
          echo "=== val_24 lines ==="
          grep "val_24" raw.param || echo "(none)"
          ls -lh raw.param raw.bin

      - name: Fix param + bin
        run: |
          python3 << 'PYEOF'
          import re, json, os

          # ── Load split config if exists ──
          blob_split_map = {}
          if os.path.exists("split_config.json"):
              with open("split_config.json") as f:
                  cfg = json.load(f)
              for n, info in cfg.items():
                  for blob, (s, e) in info["outputs"].items():
                      blob_split_map[blob] = (int(s), int(e))

          FALLBACK = {0: (0, 15), 1: (15, 18), 2: (18, 21), 3: (21, 24)}

          # ── Read raw.bin ──
          with open("raw.bin", "rb") as f:
              raw = f.read()

          # ── Parse raw.param to calculate val_24 data size ──
          # val_24 = MemoryData with 0=4 → 4 floats × 4 bytes = 16 bytes
          # onnx2ncnn writes MemoryData data sequentially to .bin
          # val_24 is the first MemoryData → first 16 bytes
          VAL24_SIZE = 4 * 4  # 16 bytes

          # ── Trim .bin: remove val_24 data from start ──
          trimmed = raw[VAL24_SIZE:]
          with open("2xParagonSR_Nano_gan.bin", "wb") as f:
              f.write(trimmed)
          print(f"Bin: {len(raw)} -> {len(trimmed)} bytes (removed {VAL24_SIZE}B val_24)")

          # ── Fix .param ──
          with open("raw.param") as f:
              lines = f.readlines()

          magic = lines[0]
          lc, bc = lines[1].strip().split()
          out = [magic, lines[1]]
          rm = 0
          add = 0

          for line in lines[2:]:
              p = line.strip().split()
              if not p:
                  out.append(line)
                  continue

              op, nm = p[0], p[1]

              # ── Remove: MemoryData val_24 (orphan, data trimmed from .bin) ──
              if op == "MemoryData" and nm == "val_24":
                  rm += 1
                  print(f"  Removed: MemoryData val_24")
                  continue

              # ── Remove: Split splitncnn_0 (consumes val_24, orphan) ──
              if op == "Split" and nm == "splitncnn_0":
                  rm += 1
                  print(f"  Removed: Split splitncnn_0")
                  continue

              # ── Dynamic Split/Slice → static Crop ──
              if op in ("Slice", "Split"):
                  try:
                      ni, no = int(p[2]), int(p[3])
                  except (IndexError, ValueError):
                      out.append(line)
                      continue
                  if ni > 1:
                      ib = p[4:4+ni]
                      ob = p[4+ni:4+ni+no]
                      for i, o in enumerate(ob):
                          s = e = None
                          if o in blob_split_map:
                              s, e = blob_split_map[o]
                          else:
                              m = re.search(r"_(\d+)$", o)
                              idx = int(m.group(1)) if m else i
                              if idx in FALLBACK:
                                  s, e = FALLBACK[idx]
                          if s is not None and e > s:
                              nc = e - s
                              out.append(
                                  f"Crop {nm}_{i} 1 1 {ib[0]} {o}"
                                  f" 2={s} 6={nc}\n"
                              )
                              add += 1
                          else:
                              out.append(line)
                      rm += 1
                      print(f"  Replaced '{nm}' -> {no} Crop")
                      continue

              # ── DepthToSpace → PixelShuffle ──
              if op == "DepthToSpace":
                  line = line.replace("DepthToSpace", "PixelShuffle")
                  if " 0=" not in line:
                      line = line.rstrip() + " 0=2\n"

              out.append(line)

          # ── Update header ──
          new_lc = int(lc) - rm + add
          out[1] = f"{new_lc} {bc}\n"

          with open("2xParagonSR_Nano_gan.param", "w") as f:
              f.writelines(out)

          print(f"\nRemoved {rm}, Added {add}, Layers: {lc} -> {new_lc}")

          # ── Verify no val_24 or splitncnn_0 ──
          with open("2xParagonSR_Nano_gan.param") as f:
              txt = f.read()
          assert "val_24" not in txt, "ERROR: val_24 still in param!"
          assert "splitncnn_0" not in txt, "ERROR: splitncnn_0 still in param!"
          print("Verified: no val_24, no splitncnn_0")
          PYEOF

      - name: Optimize NCNN (fuse MemoryData -> Scale)
        run: |
          NCNNOPT=./ncnn-20240820-ubuntu-2204/bin/ncnnoptimize

          echo "=== Before optimize ==="
          echo "MemoryData: $(grep -c MemoryData 2xParagonSR_Nano_gan.param || echo 0)"

          if $NCNNOPT 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin \
               optimized.param optimized.bin 0; then
            mv optimized.param 2xParagonSR_Nano_gan.param
            mv optimized.bin 2xParagonSR_Nano_gan.bin
            echo ""
            echo "=== After optimize ==="
            echo "MemoryData: $(grep -c MemoryData 2xParagonSR_Nano_gan.param || echo 0)"
            echo "✅ ncnnoptimize OK - MemoryData fused into Scale"
          else
            echo "❌ ncnnoptimize failed"
            exit 1
          fi

      - name: Validate final
        run: |
          echo "=== Final Param ==="
          head -5 2xParagonSR_Nano_gan.param
          echo ""

          MD=$(grep -c "MemoryData" 2xParagonSR_Nano_gan.param 2>/dev/null || echo "0")
          INPUTS=$(grep -c "^Input" 2xParagonSR_Nano_gan.param)
          echo "MemoryData: $MD"
          echo "Input layers: $INPUTS"
          echo ""

          if [ "$MD" -gt 0 ]; then
            echo "WARNING: MemoryData still present"
          fi
          if [ "$INPUTS" -ne 1 ]; then
            echo "ERROR: Expected 1 Input, got $INPUTS"
            exit 1
          fi

          echo "=== Layer summary ==="
          awk 'NR>2 {print $1}' 2xParagonSR_Nano_gan.param | sort | uniq -c | sort -rn

          BIN_SIZE=$(stat -c%s "2xParagonSR_Nano_gan.bin")
          [ "$BIN_SIZE" -lt 100000 ] && echo "ERROR: .bin too small!" && exit 1

          echo ""
          echo "=== SUCCESS ==="
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 1

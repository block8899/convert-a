name: Convert 2xParagonSR_Nano_gan

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install onnx onnxsim numpy

      - name: Download ONNX model
        run: |
          wget -q -O net_g_75000_fused_op18_fp32.onnx \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q -O net_g_75000_fused_op18_fp32.onnx.data \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"
          ls -lh net_g_75000_fused_op18_fp32.onnx net_g_75000_fused_op18_fp32.onnx.data

      - name: Merge data & decompose Mish
        run: |
          python3 << 'PYEOF'
          import onnx, os, numpy as np
          from onnx import helper

          model = onnx.load("net_g_75000_fused_op18_fp32.onnx")

          new_nodes = []
          for node in model.graph.node:
              if node.op_type == "Mish":
                  x = node.input[0]; y = node.output[0]
                  new_nodes.append(helper.make_node("Softplus", [x], [y+"_sp"]))
                  new_nodes.append(helper.make_node("Tanh", [y+"_sp"], [y+"_th"]))
                  new_nodes.append(helper.make_node("Mul", [x, y+"_th"], [y]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)

          onnx.save(model, "merged.onnx", save_as_external_data=False)
          print(f"Saved merged.onnx ({os.path.getsize('merged.onnx')/(1024*1024):.1f} MB)")
          PYEOF

      - name: Simplify ONNX
        run: |
          python -m onnxsim merged.onnx model_simplified.onnx \
            --input-shape "input:1,3,512,512" 2>&1 \
            || cp merged.onnx model_simplified.onnx
          ls -lh model_simplified.onnx

      - name: Download ncnn tools
        run: |
          wget -q "https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip"
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/*
          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb"
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb || true

      - name: Convert ONNX to NCNN
        run: |
          ./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn model_simplified.onnx raw.param raw.bin 2>&1
          ls -lh raw.param raw.bin

      - name: Rebuild param + bin (fix MemoryData, remove orphans, Split->Crop)
        run: |
          python3 << 'PYEOF'
          import re, os, struct, numpy as np, onnx

          onnx_model = onnx.load("merged.onnx")
          init_map = {i.name: i for i in onnx_model.graph.initializer}

          # Map ONNX Conv/ConvTranspose node -> weight/bias initializer names
          conv_weight_map = {}
          conv_bias_map = {}
          for node in onnx_model.graph.node:
              if node.op_type in ("Conv", "ConvTranspose"):
                  conv_weight_map[node.name] = node.input[1]
                  if len(node.input) > 2:
                      conv_bias_map[node.name] = node.input[2]
                  else:
                      conv_bias_map[node.name] = None
              elif node.op_type == "ConvInteger":
                  conv_weight_map[node.name] = node.input[1]

          def get_arr(name):
              if name in init_map:
                  return np.array(onnx.numpy_helper.to_array(init_map[name]),
                                  dtype=np.float32).flatten()
              return None

          # Split config from ONNX
          blob_split_map = {}
          for node in onnx_model.graph.node:
              if node.op_type != "Split":
                  continue
              split_sizes = []
              if len(node.input) > 1 and node.input[1]:
                  for init in onnx_model.graph.initializer:
                      if init.name == node.input[1]:
                          if init.raw_data:
                              dt = np.int64 if init.data_type == 7 else np.int32
                              split_sizes = np.frombuffer(init.raw_data, dtype=dt).tolist()
                          if not split_sizes and list(init.int64_data):
                              split_sizes = list(init.int64_data)
                          if not split_sizes and list(init.int32_data):
                              split_sizes = list(init.int32_data)
                          break
              if not split_sizes:
                  for attr in node.attribute:
                      if attr.name == "split":
                          split_sizes = list(attr.ints)
                          break
              if split_sizes:
                  offsets = [0]
                  for s in split_sizes:
                      offsets.append(offsets[-1] + int(s))
                  for i, out_name in enumerate(node.output):
                      blob_split_map[out_name] = (offsets[i], offsets[i+1])

          FALLBACK = {0: (0, 15), 1: (15, 18), 2: (18, 21), 3: (21, 24)}

          # Read raw.param
          with open("raw.param", "r") as f:
              lines = f.readlines()

          magic  = lines[0]
          counts = lines[1].strip().split()
          total_layers = int(counts[0])
          total_blobs  = int(counts[1])

          # Parse all layers
          layers = []
          for line in lines[2:]:
              parts = line.strip().split()
              if not parts:
                  continue
              layers.append(parts)

          # Collect consumed blob names
          consumed = set()
          for parts in layers:
              try:
                  ni = int(parts[2])
                  for b in parts[4:4+ni]:
                      consumed.add(b)
              except (IndexError, ValueError):
                  pass

          # Identify unused initializers (orphans)
          orphan_inits = set()
          for init in onnx_model.graph.initializer:
              if init.name not in consumed:
                  orphan_inits.add(init.name)

          # Build new .param + .bin
          new_param_lines = [magic, lines[1]]
          new_bin = bytearray()
          removed = 0
          added = 0

          def write_floats(arr):
              while len(new_bin) % 4 != 0:
                  new_bin.append(0)
              offset = len(new_bin)
              new_bin.extend(arr.astype(np.float32).tobytes())
              return offset, len(arr) * 4

          for parts in layers:
              op   = parts[0]
              name = parts[1]

              # Remove orphan MemoryData (e.g. val_24)
              if op == "MemoryData" and name in orphan_inits:
                  removed += 1
                  print(f"  Removed orphan: {op} {name}")
                  continue

              # Remove orphan Split (e.g. splitncnn_0)
              if op == "Split":
                  try:
                      no = int(parts[3])
                      out_blobs = parts[4+int(parts[2]):4+int(parts[2])+no]
                      if all(b.split("_splitncnn_")[0] in orphan_inits for b in out_blobs):
                          removed += 1
                          print(f"  Removed orphan: {op} {name}")
                          continue
                  except (IndexError, ValueError):
                      pass

              # Fix MemoryData: write data to .bin with offset+size
              if op == "MemoryData":
                  try:
                      out_blob = parts[4]
                      w = h = d = c = 1
                      for p in parts[5:]:
                          if "=" in p:
                              k, v = p.split("=", 1)
                              ki = int(k)
                              if   ki == 0: w = int(v)
                              elif ki == 1: h = int(v)
                              elif ki == 2: d = int(v)
                              elif ki == 3: c = int(v)
                      total = w * h * d * c
                      arr = get_arr(name)
                      if arr is not None and len(arr) == total:
                          off, sz = write_floats(arr)
                          new_param_lines.append(
                              f"MemoryData {name} 0 1 {out_blob}"
                              f" 0={w} 1={h} 2={d} 3={c}"
                              f" 10={off} 11={sz}\n"
                          )
                          print(f"  Fixed MemoryData: {name} ({total}f, off={off})")
                          continue
                      else:
                          removed += 1
                          print(f"  Removed (no data): {name}")
                          continue
                  except Exception as e:
                      removed += 1
                      print(f"  Removed (error {name}): {e}")
                      continue

              # Dynamic Split/Slice -> static Crop
              if op in ("Slice", "Split"):
                  try:
                      ni = int(parts[2])
                      no = int(parts[3])
                  except (IndexError, ValueError):
                      new_param_lines.append(" ".join(parts) + "\n")
                      continue
                  if ni > 1:
                      in_blobs  = parts[4:4+ni]
                      out_blobs = parts[4+ni:4+ni+no]
                      data_blob = in_blobs[0]
                      for i, ob in enumerate(out_blobs):
                          if ob in blob_split_map:
                              s, e = blob_split_map[ob]
                          else:
                              idx = -1
                              m = re.search(r"_(\d+)$", ob)
                              if m: idx = int(m.group(1))
                              if idx not in FALLBACK: idx = i
                              if idx in FALLBACK:
                                  s, e = FALLBACK[idx]
                              else:
                                  new_param_lines.append(" ".join(parts) + "\n")
                                  continue
                          nc = e - s
                          if nc <= 0:
                              new_param_lines.append(" ".join(parts) + "\n")
                              continue
                          new_param_lines.append(
                              f"Crop            {name}_{i} 1 1 {data_blob} {ob}"
                              f" 2={s} 6={nc}\n"
                          )
                          added += 1
                      removed += 1
                      print(f"  Replaced '{name}' -> {no} Crop")
                      continue

              # Convolution/ConvolutionDepthWise: write weights+bias to .bin
              if op in ("Convolution", "ConvolutionDepthWise"):
                  wname = conv_weight_map.get(name)
                  bname = conv_bias_map.get(name, None)
                  w_arr = get_arr(wname) if wname else None
                  b_arr = get_arr(bname) if bname else None
                  has_bias = b_arr is not None

                  if w_arr is not None:
                      w_off, w_sz = write_floats(w_arr)
                      if has_bias:
                          b_off, b_sz = write_floats(b_arr)

                      # Update param: set 6=weight_data_size, 5=1 for bias
                      new_parts = list(parts)
                      new_parts.append(f"6={w_sz}")
                      if has_bias:
                          new_parts.append("5=1")
                      new_param_lines.append(" ".join(new_parts) + "\n")
                      print(f"  Fixed {op}: {name} (w={w_sz}B"
                            f"{', bias=' + str(b_sz) + 'B' if has_bias else ''})")
                  else:
                      new_param_lines.append(" ".join(parts) + "\n")
                      print(f"  WARNING: no weight data for {name}")
                  continue

              # DepthToSpace -> PixelShuffle
              if op == "DepthToSpace":
                  line = " ".join(parts)
                  line = line.replace("DepthToSpace", "PixelShuffle")
                  if " 0=" not in line:
                      line += " 0=2"
                  new_param_lines.append(line + "\n")
                  print(f"  DepthToSpace -> PixelShuffle: {name}")
                  continue

              # Keep all other layers as-is
              new_param_lines.append(" ".join(parts) + "\n")

          # Update header
          final_layers = total_layers - removed + added
          new_param_lines[1] = f"{final_layers} {total_blobs}\n"

          # Write output files
          with open("2xParagonSR_Nano_gan.param", "w") as f:
              f.writelines(new_param_lines)
          with open("2xParagonSR_Nano_gan.bin", "wb") as f:
              f.write(new_bin)

          print(f"\n✅ Removed {removed}, Added {added}")
          print(f"✅ Layers: {total_layers} -> {final_layers}")
          print(f"✅ Bin: {len(new_bin)} bytes ({len(new_bin)/(1024*1024):.1f} MB)")
          PYEOF

      - name: Optimize NCNN
        run: |
          NCNNOPTIMIZE=./ncnn-20240820-ubuntu-2204/bin/ncnnoptimize

          if $NCNNOPTIMIZE 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin \
               optimized.param optimized.bin 0; then
            mv optimized.param 2xParagonSR_Nano_gan.param
            mv optimized.bin   2xParagonSR_Nano_gan.bin
            echo "✅ ncnnoptimize OK"
          else
            echo "⚠️ ncnnoptimize failed, using pre-optimized model"
          fi

      - name: Validate
        run: |
          echo "=== Param Header ==="
          head -3 2xParagonSR_Nano_gan.param
          echo ""
          echo "MemoryData: $(grep -c MemoryData 2xParagonSR_Nano_gan.param 2>/dev/null || echo 0)"
          echo "Input: $(grep -c '^Input' 2xParagonSR_Nano_gan.param)"
          echo ""
          echo "=== Layer summary ==="
          awk 'NR>2 {print $1}' 2xParagonSR_Nano_gan.param | sort | uniq -c | sort -rn
          echo ""

          BIN_SIZE=$(stat -c%s "2xParagonSR_Nano_gan.bin")
          [ "$BIN_SIZE" -lt 100000 ] && echo "ERROR: .bin too small!" && exit 1

          echo "=== SUCCESS ==="
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 1

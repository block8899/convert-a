name: Convert 2xParagonSR_Nano_gan (ONNX->PTH->PNNX)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxsim onnx2torch pnnx numpy

      - name: Download ONNX model
        run: |
          wget -q -O net_g_75000_fused_op18_fp32.onnx \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q -O net_g_75000_fused_op18_fp32.onnx.data \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"
          ls -lh net_g_75000_fused_op18_fp32.onnx net_g_75000_fused_op18_fp32.onnx.data

      - name: Prepare + Convert
        run: |
          python3 << 'PYEOF'
          import onnx, os, torch
          from onnx import helper, numpy_helper
          from onnx2torch import convert

          # ── Step 1: Merge external data ──
          print("1. Merging external data...")
          model = onnx.load("net_g_75000_fused_op18_fp32.onnx")
          print(f"   Original opset: {model.opset_import[0].version}")

          # ── Step 2: Decompose Mish -> Softplus + Tanh + Mul ──
          print("2. Decomposing Mish nodes...")
          new_nodes = []
          mish_count = 0
          for node in model.graph.node:
              if node.op_type == "Mish":
                  mish_count += 1
                  x = node.input[0]
                  y = node.output[0]
                  sp = y + "_softplus"
                  th = y + "_tanh"
                  new_nodes.append(helper.make_node("Softplus", [x], [sp]))
                  new_nodes.append(helper.make_node("Tanh", [sp], [th]))
                  new_nodes.append(helper.make_node("Mul", [x, th], [y]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)
          print(f"   Replaced {mish_count} Mish nodes")

          # ── Step 3: Downgrade opset 18 -> 13 ──
          print("3. Downgrading opset 18 -> 13...")
          model.opset_import[0].version = 13

          # ── Step 4: Handle Split opset difference ──
          # opset 13 Split: split sizes in input[1] (initializer)
          # onnx2torch supports this. No change needed.
          onnx.save(model, "model_clean.onnx", save_as_external_data=False)
          size_mb = os.path.getsize("model_clean.onnx") / (1024*1024)
          print(f"   Saved model_clean.onnx ({size_mb:.1f} MB)")

          # ── Step 5: ONNX -> PyTorch ──
          print("4. Converting ONNX -> PyTorch...")
          pytorch_model = convert("model_clean.onnx")
          pytorch_model.eval()
          print(f"   Model type: {type(pytorch_model).__name__}")

          # Sanity check
          dummy = torch.randn(1, 3, 64, 64)
          with torch.no_grad():
              out = pytorch_model(dummy)
          print(f"   Sanity: {list(dummy.shape)} -> {list(out.shape)}")

          # ── Step 6: Save .pth ──
          torch.save(pytorch_model.state_dict(), "model.pth")
          print(f"   Saved model.pth ({os.path.getsize('model.pth')/(1024*1024):.1f} MB)")

          # ── Step 7: TorchScript for PNNX ──
          print("5. Exporting TorchScript...")
          with torch.no_grad():
              traced = torch.jit.trace(pytorch_model, dummy)
          traced.save("model.pt")
          print(f"   Saved model.pt ({os.path.getsize('model.pt')/(1024*1024):.1f} MB)")

          print("\n✅ ONNX -> PyTorch -> TorchScript OK")
          PYEOF

      - name: PNNX -> NCNN
        run: |
          pnnx model.pt inputshape=[1,3,128,128] inputshape2=[1,3,256,256]

          if [ -f "model.ncnn.param" ]; then
            mv model.ncnn.param 2xParagonSR_Nano_gan.param
            mv model.ncnn.bin   2xParagonSR_Nano_gan.bin
            echo "✅ PNNX conversion OK"
          else
            echo "❌ PNNX failed"
            exit 1
          fi

      - name: Validate
        run: |
          echo "=== Param Header ==="
          head -3 2xParagonSR_Nano_gan.param
          echo ""

          MD=$(grep -c "MemoryData" 2xParagonSR_Nano_gan.param 2>/dev/null || echo "0")
          echo "MemoryData: $MD"
          echo "Input: $(grep -c '^Input' 2xParagonSR_Nano_gan.param)"
          echo ""

          echo "=== Layer summary ==="
          awk 'NR>2 {print $1}' 2xParagonSR_Nano_gan.param | sort | uniq -c | sort -rn
          echo ""

          BIN_SIZE=$(stat -c%s "2xParagonSR_Nano_gan.bin")
          if [ "$BIN_SIZE" -lt 50000 ]; then
            echo "ERROR: .bin too small ($BIN_SIZE bytes)!"
            exit 1
          fi

          echo "=== CONVERSION SUCCESS ==="
          ls -lh 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 1

name: Convert 2xParagonSR_Nano_gan

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install onnx onnxsim numpy

      - name: Download ONNX model
        run: |
          wget -q -O net_g_75000_fused_op18_fp32.onnx \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx"
          wget -q -O net_g_75000_fused_op18_fp32.onnx.data \
            "https://github.com/Phhofm/models/releases/download/2xParagonSR_Nano_gan/2xParagonSR_Nano_gan_op18_fp32.onnx.data"

      - name: Merge data & decompose Mish
        run: |
          python3 << 'PYEOF'
          import onnx, os
          from onnx import helper
          model = onnx.load("net_g_75000_fused_op18_fp32.onnx")
          new_nodes = []
          for node in model.graph.node:
              if node.op_type == "Mish":
                  x = node.input[0]; y = node.output[0]
                  new_nodes.append(helper.make_node("Softplus", [x], [y+"_sp"]))
                  new_nodes.append(helper.make_node("Tanh", [y+"_sp"], [y+"_th"]))
                  new_nodes.append(helper.make_node("Mul", [x, y+"_th"], [y]))
              else:
                  new_nodes.append(node)
          del model.graph.node[:]
          model.graph.node.extend(new_nodes)
          onnx.save(model, "merged.onnx", save_as_external_data=False)
          print(f"merged.onnx: {os.path.getsize('merged.onnx')/(1024*1024):.1f} MB")
          PYEOF

      - name: Simplify ONNX
        run: |
          python -m onnxsim merged.onnx model_simplified.onnx \
            --input-shape "input:1,3,512,512" 2>&1 || cp merged.onnx model_simplified.onnx

      - name: Download ncnn tools
        run: |
          wget -q "https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-ubuntu-2204.zip"
          unzip -q ncnn-20240820-ubuntu-2204.zip
          chmod +x ncnn-20240820-ubuntu-2204/bin/*
          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/p/protobuf/libprotobuf23_3.12.4-1ubuntu7_amd64.deb"
          sudo dpkg -i libprotobuf23_3.12.4-1ubuntu7_amd64.deb || true

      - name: Convert ONNX to NCNN
        run: |
          ./ncnn-20240820-ubuntu-2204/bin/onnx2ncnn model_simplified.onnx raw.param raw.bin 2>&1
          ls -lh raw.param raw.bin

      - name: Fix ALL issues (single script)
        run: |
          python3 << 'PYEOF'
          import re, os

          FALLBACK = {0: (0, 15), 1: (15, 18), 2: (18, 21), 3: (21, 24)}

          with open("raw.param") as f:
              lines = f.readlines()

          # ══════════════════════════════════════════════════
          # STEP 1: Calculate val_24 position in .bin
          # ══════════════════════════════════════════════════
          bin_offset = 0
          val24_off = None
          val24_sz = None

          for line in lines[2:]:
              p = line.strip().split()
              if not p:
                  continue
              # MemoryData writes data sequentially to .bin
              if p[0] == "MemoryData":
                  w = h = d = c = 1
                  for pp in p[5:]:
                      if "=" in pp:
                          k, v = pp.split("=", 1)
                          ki = int(k)
                          if   ki == 0: w = int(v)
                          elif ki == 1: h = int(v)
                          elif ki == 2: d = int(v)
                          elif ki == 3: c = int(v)
                  sz = w * h * d * c * 4  # bytes
                  if p[1] == "val_24":
                      val24_off = bin_offset
                      val24_sz = sz
                  bin_offset += sz
              # Convolution writes AFTER all MemoryData
              elif p[0] in ("Convolution", "ConvolutionDepthWise"):
                  break

          print(f"val_24: offset={val24_off}, size={val24_sz}")

          # ══════════════════════════════════════════════════
          # STEP 2: Trim val_24 from .bin
          # ══════════════════════════════════════════════════
          with open("raw.bin", "rb") as f:
              raw = f.read()

          if val24_off is not None and val24_sz:
              new_bin = raw[:val24_off] + raw[val24_off + val24_sz:]
          else:
              new_bin = raw

          with open("2xParagonSR_Nano_gan.bin", "wb") as f:
              f.write(new_bin)
          print(f"Bin: {len(raw)} -> {len(new_bin)} bytes")

          # ══════════════════════════════════════════════════
          # STEP 3: Fix .param
          # ══════════════════════════════════════════════════
          lc, bc = lines[1].strip().split()
          out = [lines[0], lines[1]]
          rm = 0; add = 0; kernel_fix = 0

          for line in lines[2:]:
              p = line.strip().split()
              if not p:
                  out.append(line)
                  continue
              op, nm = p[0], p[1]

              # ── Remove val_24 + splitncnn_0 ──
              if op == "MemoryData" and nm == "val_24":
                  rm += 1; continue
              if op == "Split" and nm == "splitncnn_0":
                  rm += 1; continue

              # ── Dynamic Split → static Crop ──
              if op in ("Slice", "Split"):
                  try:
                      ni, no = int(p[2]), int(p[3])
                  except (IndexError, ValueError):
                      out.append(line); continue
                  if ni > 1:
                      ib = p[4:4+ni]; ob = p[4+ni:4+ni+no]
                      for i, o in enumerate(ob):
                          s = e = None
                          m = re.search(r"_(\d+)$", o)
                          idx = int(m.group(1)) if m else i
                          if idx in FALLBACK:
                              s, e = FALLBACK[idx]
                          if s is not None and e > s:
                              out.append(f"Crop {nm}_{i} 1 1 {ib[0]} {o} 2={s} 6={e-s}\n")
                              add += 1
                          else:
                              out.append(line)
                      rm += 1; continue

              # ── ★ FIX: Add kernel params to ALL Conv/ConvDW ──
              if op in ("Convolution", "ConvolutionDepthWise"):
                  params = {}
                  for pp in p[5:]:
                      if "=" in pp:
                          k, v = pp.split("=", 1)
                          try: params[int(k)] = int(v)
                          except: pass

                  if 1 not in params:
                      # Infer kernel from padding
                      pl = params.get(4, 0)
                      pt = params.get(14, 0)
                      pr = params.get(15, 0)
                      pb = params.get(16, 0)
                      kw = pl + pr + 1
                      kh = pt + pb + 1
                      # Insert 1= and 11= BEFORE other params
                      # Rebuild line cleanly (no duplicates)
                      head = p[:5]  # Type Name NumIn NumOut
                      tail = p[5:]  # blobs + params
                      # Remove any existing 1= or 11= (shouldn't exist but safe)
                      clean_tail = [x for x in tail if not x.startswith("1=") and not x.startswith("11=")]
                      # Build: head + blobs + kernel_params + other_params
                      # Blobs are before first "=" param
                      blob_part = []
                      param_part = []
                      for x in clean_tail:
                          if "=" in x and not blob_part:
                              # Wait, blobs don't have "="
                              pass
                          if "=" in x:
                              param_part.append(x)
                          else:
                              blob_part.append(x)
                      # Reconstruct: Type Name NumIn NumOut blobs 1=kw 11=kh other_params
                      newline = " ".join(head + blob_part) + f" 1={kw} 11={kh} " + " ".join(param_part) + "\n"
                      out.append(newline)
                      kernel_fix += 1
                      continue

              # ── DepthToSpace → PixelShuffle ──
              if op == "DepthToSpace":
                  line = line.replace("DepthToSpace", "PixelShuffle")
                  if " 0=" not in line:
                      line = line.rstrip() + " 0=2\n"

              out.append(line)

          out[1] = f"{int(lc)-rm+add} {bc}\n"
          with open("2xParagonSR_Nano_gan.param", "w") as f:
              f.writelines(out)

          print(f"\nRemoved {rm}, Added {add} Crop, Fixed kernel: {kernel_fix}")
          PYEOF

      - name: Debug - verify
        run: |
          echo "=== Conv WITHOUT kernel (should be empty) ==="
          grep -E "^Convolution\b" 2xParagonSR_Nano_gan.param | grep -v " 1=" | head -3 || echo "(none - all fixed)"
          echo ""
          echo "=== ConvDW WITHOUT kernel (should be empty) ==="
          grep "^ConvolutionDepthWise" 2xParagonSR_Nano_gan.param | grep -v " 1=" | head -3 || echo "(none - all fixed)"
          echo ""
          echo "=== MemoryData ==="
          grep -c "MemoryData" 2xParagonSR_Nano_gan.param || echo "0"

      - name: Optimize NCNN
        run: |
          NCNNOPT=./ncnn-20240820-ubuntu-2204/bin/ncnnoptimize
          echo "MemoryData before: $(grep -c MemoryData 2xParagonSR_Nano_gan.param || echo 0)"

          if $NCNNOPT 2xParagonSR_Nano_gan.param 2xParagonSR_Nano_gan.bin \
               optimized.param optimized.bin 0; then
            mv optimized.param 2xParagonSR_Nano_gan.param
            mv optimized.bin 2xParagonSR_Nano_gan.bin
            echo "MemoryData after: $(grep -c MemoryData 2xParagonSR_Nano_gan.param || echo 0)"
            echo "✅ ncnnoptimize OK"
          else
            echo "❌ ncnnoptimize failed"
            exit 1
          fi

      - name: Validate
        run: |
          head -3 2xParagonSR_Nano_gan.param
          echo "MemoryData: $(grep -c MemoryData 2xParagonSR_Nano_gan.param 2>/dev/null || echo 0)"
          echo "Input: $(grep -c '^Input' 2xParagonSR_Nano_gan.param)"
          ls -lh 2xParagonSR_Nano_gan.*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 2xParagonSR_Nano_gan_ncnn
          path: |
            2xParagonSR_Nano_gan.param
            2xParagonSR_Nano_gan.bin
          retention-days: 1

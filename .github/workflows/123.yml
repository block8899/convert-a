name: Convert Real-PLKSR Dynamic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: |
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install packaging safetensors spandrel onnx pnnx

      - name: ⬇️ Download PTH
        run: |
          wget -O model.pth https://github.com/Phhofm/models/releases/download/2xPublic_realplksr_dysample_layernorm_real/2xPublic_realplksr_dysample_layernorm_real.pth

      - name: 🔄 Export ONNX (Dynamic Axes)
        shell: python
        run: |
          import torch
          from spandrel import ModelLoader

          arch = ModelLoader().load_from_file("model.pth")
          model = arch.model.eval()
          
          dummy = torch.randn(1, 3, 256, 256)

          with torch.no_grad():
              torch.onnx.export(
                  model, 
                  dummy, 
                  "model.onnx", 
                  opset_version=17,
                  input_names=['in0'],
                  output_names=['out0'],
                  dynamic_axes={
                      'in0': {2: 'height', 3: 'width'},
                      'out0': {2: 'height_out', 3: 'width_out'}
                  }
              )
          print("✅ ONNX exported with dynamic axes")

      - name: 🔄 PNNX → NCNN
        run: |
          # PNNX hỗ trợ đọc trực tiếp file ONNX
          pnnx model.onnx
          
          if [ -f "model.ncnn.param" ]; then
            mv model.ncnn.param 2xPublic_realplksr_dysample_layernorm_real.ncnn.param
            mv model.ncnn.bin   2xPublic_realplksr_dysample_layernorm_real.ncnn.bin
            echo "✅ NCNN conversion successful!"
            ls -lh *.ncnn.*
          else
            echo "❌ PNNX failed"
            exit 1
          fi

      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: realplksr-dynamic-converted
          path: |
            *.ncnn.param
            *.ncnn.bin
